version: '3.8'
services:
    postgres:
        image: postgres:15-alpine
        container_name: kinomir-db-local
        environment:
            POSTGRES_USER: admin
            POSTGRES_PASSWORD: adm1n
            POSTGRES_DB: kinomirdb
        ports:
            - "5432:5432"
        volumes:
            - ./postgres-data:/var/lib/postgresql/data